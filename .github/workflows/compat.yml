# Compatibility matrix: the whole real-WordPress suite (tests/integration/all.sh:
# Yoast SEO, Rank Math, SEOPress, AIOSEO, no SEO plugin, multisite, WooCommerce,
# Polylang, TranslatePress, caching and the 1.0.0 upgrade) on every PHP version
# the plugin supports, against the current WordPress and plugin releases. A
# second job runs the suites that need no third-party plugin on the oldest
# WordPress the readme claims (Requires at least). Results feed
# docs/compatibility.md.
#
# No third-party actions: each job runs inside the official Docker Hub php:<v>-cli
# image. Until 24 Nov 2026 PHP came from the ondrej/php launchpad PPA, which
# answered 503 for a whole day (23 Nov: 4-5 of 8 jobs red even with 4 retries).
name: compat

on:
  push:
    branches: [main, 'wp/compat-*'] # TEMP branch trigger
    paths-ignore: ['**.md', 'wordpress-org/**']
  schedule:
    - cron: '17 5 * * 1' # Mondays: new WordPress / SEO plugin releases land without a push here
  workflow_dispatch:

permissions:
  contents: read

env:
  WP_CLI_ALLOW_ROOT: '1' # the php:<v>-cli containers run as root; wp-cli refuses root without it

jobs:
  downloads:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch WordPress, the SEO plugins and wp-cli (one set for every job)
        run: |
          mkdir cache && cd cache
          get() { curl -fsSL --retry 3 "$2" -o "$1"; }
          get wordpress.zip https://wordpress.org/latest.zip
          get wordpress-min.zip https://wordpress.org/wordpress-6.2.zip
          for p in sqlite-database-integration:sqlite seo-by-rank-math:rankmath wordpress-seo:yoast \
                   wp-seopress:seopress all-in-one-seo-pack:aioseo elementor:elementor woocommerce:woocommerce \
                   polylang:polylang translatepress-multilingual:translatepress wp-super-cache:wp-super-cache; do
            get "${p#*:}.zip" "https://downloads.wordpress.org/plugin/${p%%:*}.zip"
          done
          get wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: wp-cache
          path: cache
          retention-days: 3

  php:
    needs: downloads
    runs-on: ubuntu-24.04
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - &tools
        name: PHP ${{ matrix.php }} extensions and test tools
        run: |
          # git must exist before checkout, or checkout falls back to a
          # history-less tarball and migrate-checks.sh cannot find 1.0.0.
          # php:7.4/8.0 are Debian 11 (bullseye), which deb.debian.org is retiring:
          # on 24 Nov 2026 its security index listed .debs that 404. archive.debian.org
          # holds the same packages.
          . /etc/os-release
          if [ "$VERSION_CODENAME" = bullseye ]; then
            printf '%s\n' "deb http://archive.debian.org/debian bullseye main" \
              "deb http://archive.debian.org/debian bullseye-updates main" \
              "deb http://archive.debian.org/debian-security bullseye-security main" > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*
          fi
          apt-get update -q >/dev/null
          apt-get install -y -q --no-install-recommends git unzip zip rsync jq curl python3 procps \
            libpng-dev libjpeg-dev libzip-dev >/dev/null
          docker-php-ext-configure gd --with-jpeg >/dev/null
          docker-php-ext-install -j"$(nproc)" gd zip >/dev/null
          # The SQLite drop-in (sqlite-database-integration 3.x) needs SQLite 3.37+;
          # bullseye links PHP against 3.34, so build a current libsqlite3 there.
          sqlite_old() { php -r 'exit(version_compare((new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn(), "3.37.0", "<") ? 0 : 1);'; }
          if sqlite_old; then
            cd /tmp
            curl -fsSLO https://www.sqlite.org/2025/sqlite-autoconf-3500400.tar.gz
            echo 'a3db587a1b92ee5ddac2f66b3edb41b26f9c867275782d46c3a088977d6a5b18  sqlite-autoconf-3500400.tar.gz' | sha256sum -c -
            tar xzf sqlite-autoconf-3500400.tar.gz && cd sqlite-autoconf-3500400
            # Debian's flags: PHP's sqlite3 extension calls sqlite3_column_table_name,
            # which only exists with COLUMN_METADATA.
            CPPFLAGS='-DSQLITE_ENABLE_COLUMN_METADATA=1 -DSQLITE_SECURE_DELETE=1 -DSQLITE_ENABLE_UNLOCK_NOTIFY=1 -DSQLITE_ENABLE_DBSTAT_VTAB=1 -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_RTREE=1' \
              ./configure --prefix=/usr/local >/dev/null && make -j"$(nproc)" >/dev/null && make install >/dev/null
            ldconfig && cd /tmp
          fi
          sqlite_old && { echo 'SQLite is still older than 3.37'; exit 1; }
          LD_BIND_NOW=1 php -v >/dev/null # fails here if a linked symbol is missing
          php -r 'echo "SQLite ", (new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn(), "\n";'
          # Same settings as Debian's CLI php.ini, which the PPA builds used.
          cp "$PHP_INI_DIR/php.ini-production" "$PHP_INI_DIR/php.ini"
          echo 'memory_limit = -1' > "$PHP_INI_DIR/conf.d/zz-ci.ini"
          php -v
          for m in gd zip pdo_sqlite sqlite3 mbstring curl dom xml openssl; do
            php -m | grep -qix "$m" || { echo "missing PHP extension: $m"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # migrate-checks.sh installs the 1.0.0 release from history
      - &safe
        name: Trust the checkout (container runs as root, workspace is the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: wp-cache
          path: tests/integration/.cache
      - name: All real-WordPress suites
        run: bash tests/integration/all.sh
      - name: Logs on failure
        if: failure()
        run: tail -n 60 /tmp/ccc-integration-all.*/*.log

  wordpress-min:
    needs: downloads
    runs-on: ubuntu-24.04
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4']
    steps:
      - *tools
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - *safe
      - uses: actions/download-artifact@v4
        with:
          name: wp-cache
          path: tests/integration/.cache
      - name: WordPress 6.2 (Requires at least), no third-party plugin needed
        run: |
          cd tests/integration/.cache && mv wordpress-min.zip wordpress.zip && cd -
          for s in site-settings indexnow migrate; do
            echo "== $s"
            bash "tests/integration/$s-checks.sh" > "/tmp/$s.log" 2>&1 || { tail -n 60 "/tmp/$s.log"; exit 1; }
            echo "ok ($(grep -c '^  ok' "/tmp/$s.log") checks)"
          done
